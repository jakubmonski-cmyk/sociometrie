<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sociometrie třídy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: horní lišta (třída + záložky Sběr, Výsledky, Skupiny, Pro třídu, Třída, Info). Žák z QR vidí jen telefonní dotazník. Styl: měkké karty, barevné stupnice, avatary. */
:root{
  --bg:#f5f6fb; --surface:#ffffff; --ink:#1d2140; --muted:#5d6486; --line:#e1e4f2;
  --accent:#3d5afe; --accent-ink:#ffffff; --accent-soft:#e4e9ff;
  --sun:#ffd43b; --sun-ink:#3b2f00;
  --pos:#12805c; --neg:#d6403a; --warn:#a96200; --pos-soft:#d9f5ea; --neg-soft:#fde4e2; --warn-soft:#fdf0d3;
  --s1:#ff7b72; --s2:#ffa94d; --s3:#ffd43b; --s4:#a5d84a; --s5:#3fd1a0; --on-s:#1d2140;
  --shadow:0 1px 2px rgba(29,33,64,.06),0 6px 18px rgba(29,33,64,.07);
  --f-display:'Bricolage Grotesque','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14172b; --surface:#1e2342; --ink:#eef0ff; --muted:#a6acd2; --line:#323968;
  --accent:#8091ff; --accent-ink:#0e1233; --accent-soft:#2a3270;
  --pos:#4fd6a2; --neg:#ff8c84; --warn:#f0b755; --pos-soft:#16382f; --neg-soft:#432320; --warn-soft:#3c2f12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14172b; --surface:#1e2342; --ink:#eef0ff; --muted:#a6acd2; --line:#323968;
  --accent:#8091ff; --accent-ink:#0e1233; --accent-soft:#2a3270;
  --pos:#4fd6a2; --neg:#ff8c84; --warn:#f0b755; --pos-soft:#16382f; --neg-soft:#432320; --warn-soft:#3c2f12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.12;font-weight:700}
h1{font-size:30px;font-weight:800} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13.5px}
.label{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.03em}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details summary{cursor:pointer;font-weight:600}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand select{width:auto;max-width:100%;padding:4px 10px;font-size:14px;font-weight:600;border-width:1.5px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border-radius:22px;padding:4px;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.note{background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--neg-soft)}

.panel{background:var(--surface);border-radius:18px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.rowf{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 18px;font-weight:700;min-height:46px}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:var(--neg);color:#fff}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
select,input[type=text],textarea{font:inherit;width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:110px;font-family:var(--f-mono);font-size:14px}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{accent-color:var(--accent);margin-top:4px}

.av{--h:200;display:inline-grid;place-items:center;width:var(--sz,40px);height:var(--sz,40px);border-radius:50%;background:hsl(var(--h) 80% 80%);color:#1d2140;font-weight:800;font-family:var(--f-display);font-size:calc(var(--sz,40px)*.4);flex:none}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--pos-soft);color:var(--pos)} .pill.wait{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--neg-soft);color:var(--neg)}

/* žák (telefon) */
.phone{width:100%;max-width:420px;margin:0 auto;background:var(--surface);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:18px;min-height:600px;box-shadow:var(--shadow)}
.phone.full{min-height:calc(100dvh - 76px);box-shadow:none;background:transparent;padding:4px 0}
.dots{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.dots>i{display:block;height:100%;background:linear-gradient(90deg,var(--s2),var(--s3),var(--s5));border-radius:6px;transition:width .3s}
.q{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2;text-wrap:balance}
.who{display:flex;align-items:center;gap:14px}
.who b{font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:800}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{height:52px;border:0;border-radius:14px;background:var(--bg);font-family:var(--f-display);font-weight:800;font-size:20px;box-shadow:inset 0 -5px 0 var(--c)}
.scale button.on{background:var(--c);color:var(--on-s);box-shadow:none;transform:translateY(-2px)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--bg);border-radius:999px;padding:8px 14px 8px 8px;min-height:46px;display:flex;align-items:center;gap:9px;font-weight:600}
.chip .av{--sz:30px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.neg.on{background:var(--neg);color:#fff}
.chip.plain{padding:8px 16px}
.chip[disabled]{opacity:.38;cursor:not-allowed}
.bubble{background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:12px 14px;font-weight:600}
.big-ok{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--pos)}
.qr{background:#fff;padding:12px;border-radius:16px;width:max-content;max-width:100%}
.qr svg{display:block;width:190px;height:190px}
.codebox{font-family:var(--f-mono);font-size:12.5px;word-break:break-all;background:var(--bg);border-radius:12px;padding:10px 12px;user-select:all}

/* učitel */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subtabs button{border:0;background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;box-shadow:var(--shadow)}
.subtabs button[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.rowf select{width:auto}
.subtabs select{width:auto;padding:6px 10px;font-size:14px;border-width:1.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile b{font-family:var(--f-display);font-size:30px;font-weight:800}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tag.star{background:var(--pos-soft);color:var(--pos)}
.tag.rej{background:var(--neg-soft);color:var(--neg)}
.tag.izol,.tag.vliv{background:var(--warn-soft);color:var(--warn)}
.tag.mid{background:var(--bg);color:var(--muted)}
.attn{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.attn li{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0}
.kl{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:10px;align-items:center;font-size:14.5px}
.kl .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.kl .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.sel td{background:var(--accent-soft)}
tbody tr[data-a]{cursor:pointer}
.sg{width:100%;height:auto;display:block}
.sg text{fill:var(--ink);font:11px var(--f-body)}
.sg .ring{fill:none;stroke:var(--line);stroke-dasharray:3 5}
.sg .e-mut{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}
.sg .e-pos{stroke:var(--muted);stroke-width:1;opacity:.45}
.sg .e-neg{stroke:var(--neg);stroke-width:1.5;stroke-dasharray:5 4}
.sg .dim{opacity:.08}
.sg .node{cursor:pointer}
.sg .node circle{stroke:var(--surface);stroke-width:2.5}
.sg .node.s-star circle{fill:var(--pos)} .sg .node.s-rej circle{fill:var(--neg)}
.sg .node.s-izol circle,.sg .node.s-vliv circle{fill:var(--warn)} .sg .node.s-mid circle{fill:var(--muted)}
.sg .node.sel circle{stroke:var(--ink);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
dl.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px}
dl.det dt{color:var(--muted)} dl.det dd{margin:0}
.live{display:flex;flex-wrap:wrap;gap:8px}
.live .chip{cursor:default;padding-right:14px;font-size:14.5px}
.live .chip.on{background:var(--accent-soft);color:var(--ink)}
.live .chip.fill{background:var(--warn-soft);color:var(--ink)}
.live .chip.done{background:var(--pos-soft);color:var(--pos)}
.live .chip small{font-weight:500;color:var(--muted)}
.fb{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fb .ok{color:var(--pos)} .fb .bad{color:var(--neg)}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.doc section{display:flex;flex-direction:column;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .val{fill:var(--ink);font-weight:700;font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .m{display:flex;align-items:center;gap:10px}
.grp .m small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.grp .m small.ok{color:var(--pos)} .grp .m small.no{color:var(--warn)}

/* souhrn pro třídu */
.show{background:var(--surface);border-radius:28px;padding:clamp(20px,4vw,48px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:clamp(18px,3vw,32px)}
.show:fullscreen{border-radius:0;justify-content:center;overflow:auto}
.show h2{font-size:clamp(26px,4vw,48px);font-weight:800}
.show .big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:700px){.show .big{grid-template-columns:minmax(0,1fr)}}
.show .card{background:var(--bg);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px}
.show .card b{font-family:var(--f-display);font-size:clamp(40px,6vw,72px);font-weight:800;line-height:1}
.show .card span{font-size:clamp(15px,1.6vw,20px)}
.show .card .chg{font-size:15px;font-weight:700}
.chg.up{color:var(--pos)} .chg.down{color:var(--neg)} .chg.same{color:var(--muted)}
.show .card.sun{background:var(--sun);color:var(--sun-ink)}

/* lístky */
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.slip{background:#fff;color:#111;border:1.5px dashed #9aa;border-radius:10px;padding:14px;display:flex;gap:14px;align-items:center;break-inside:avoid}
.slip .qrb{flex:none;line-height:0}
.slip .qrb svg{width:120px;height:120px}
.slip .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.slip .t b{font-family:var(--f-display);font-size:19px;line-height:1.1}
.slip .t small{font-size:12px;color:#444}
.slip .t .cd{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .wrap{max-width:none;gap:0}
  .panel{box-shadow:none;padding:0;background:#fff}
  .slips{grid-template-columns:1fr 1fr;gap:0}
  .slip{height:54mm;border-radius:0;padding:5mm;gap:5mm}
  .slip .qrb svg{width:40mm;height:40mm}
  .slip .t b{font-size:15pt} .slip .t small{font-size:8.5pt} .slip .t .cd{font-size:10pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= nastavení spojení ================= */
const PEER_PREFIX='kolofik-sociometrie-';
const PEER_OPTS=Object.assign({debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}},window.SOC_PEER_OPTS||{});

/* ================= pomocné ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))||1};
const f1=x=>x==null||isNaN(x)?'–':x.toFixed(1).replace('.',',');
const cl=x=>Math.max(1,Math.min(5,x));
const MAXN=36, ALPH='23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function randStr(n,al){al=al||ALPH;const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,v=>al[v%al.length]).join('')}
function b64e(s){const b=new TextEncoder().encode(s);let t='';b.forEach(c=>t+=String.fromCharCode(c));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const t=atob(s);return new TextDecoder().decode(Uint8Array.from(t,c=>c.charCodeAt(0)))}
function chk(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%46656;return h.toString(36).padStart(3,'0')}
function qrSvg(text,ecc){try{const q=qrcode(0,ecc||'L');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return '<span class="small" style="color:#900">QR kód nejde vytvořit.</span>'}}
function avatar(name,idx,sz){const ini=(name.match(/[A-Za-zÀ-ž]/)||['?'])[0].toUpperCase();return `<span class="av" style="--h:${(idx*47+20)%360};--sz:${sz||40}px" aria-hidden="true">${esc(ini)}</span>`}
function baseUrl(){try{return location.href.split('#')[0].split('?')[0]}catch(e){return ''}}
function shortName(line,mode){line=line.trim().replace(/\s+/g,' ').replace(/[|~]/g,'');const p=line.split(' ');if(!mode||p.length<2)return line;return p[0]+' '+p[p.length-1][0].toUpperCase()+'.'}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmtDate=iso=>{const d=new Date(iso);return d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear()};
const shortDate=iso=>{const d=new Date(iso);return d.getDate()+'. '+(d.getMonth()+1)+'.'};
const TYPE={c:'Check-in',f:'Plné kolo'};
function copyText(t,done){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done(true)}catch(e){done(false)}ta.remove()};
  try{navigator.clipboard.writeText(t).then(()=>done(true),fb)}catch(e){fb()}
}

/* ================= otázky ================= */
const KLIMA=['Ve třídě se cítím dobře.','Když něco nevím, nebojím se zeptat spolužáků.','Můžu říct svůj názor a nikdo se mi nesměje.','Spolužáci si ve třídě navzájem pomáhají.','Ve třídě se dodržují dohodnutá pravidla.'];
const KL_SHORT=['Cítím se dobře','Nebojím se zeptat','Nikdo se nesměje','Pomáháme si','Dodržujeme pravidla'];
const KL_SHOW=['Ve třídě se cítíme dobře','Nebojíme se zeptat','Můžeme říct názor','Pomáháme si','Dodržujeme pravidla'];

/* ================= ukázková třída ================= */
const DEMO_NAMES=['Adam N.','Barbora K.','Dominik S.','Ema P.','Filip H.','Ivo R.','Jakub V.','Karolína B.','Lukáš D.','Marek Z.','Nikolas F.','Ondřej C.','Patrik B.','Radek T.'];
const D_CL=[0,1,0,1,0,9,0,1,2,2,9,2,0,2];
const D_POP=[.3,.3,1.5,.6,.5,-.1,.5,.3,.2,-.6,-1.6,.1,.2,.2];
const D_INF=[.2,0,1.6,.1,.8,-1,.3,0,.5,1.5,.9,0,.1,0];
function demoResp(n,o){
  const r=rng(o.seed),R=Array(n).fill(null);
  for(let i=0;i<n;i++){ if(o.missing.includes(i))continue;
    const a={symp:{},vliv:{},coop:[],free:[],neg:[],klima:[],ubl:'ne'},sc={},sf={},sy={};
    for(let j=0;j<n;j++){ if(j===i)continue;

  const body=['R2',cid,idx.toString(36),code,type,type==='f'?dig(a.symp):'',type==='f'?dig(a.vliv):'',ix(a.coop),ix(a.free),ix(a.neg),a.klima.join('')+({ano:'a',ne:'n',nevim:'x'}[a.ubl]||'x')].join('~');

function decodeResp(text,c){
  const t=text.trim();
  if(t.includes('#v2~'))return {err:'Tohle je lístek se vstupním odkazem, ne odpověď.'};
  const p=t.split('~');
  if(p[0]!=='R2'||p.length!==12)return {err:'Tohle nevypadá jako odpovědní kód.'};
  if(chk(p.slice(0,11).join('~'))!==p[11])return {err:'Kód je poškozený (překlep nebo useknutý konec).'};
  if(p[1]!==c.id)return {err:'Kód patří do jiné třídy.'};
  const n=c.students.length,idx=parseInt(p[2],36);
  if(!(idx>=0&&idx<n))return {err:'Neplatný žák v kódu.'};
  if(c.students[idx].code!==p[3])return {err:'Kód žáka nesedí s lístkem.'};
  const type=p[4]==='f'?'f':'c',a={symp:{},vliv:{},coop:[],free:[],neg:[],klima:[],ubl:'nevim'};
  if(type==='f'){
    if(p[5].length!==n||p[6].length!==n)return {err:'Kód neodpovídá počtu žáků ve třídě.'};
    for(let j=0;j<n;j++){if(j===idx)continue;const s=+p[5][j],v=+p[6][j];if(!(s>=1&&s<=5&&v>=1&&v<=5))return {err:'Kód obsahuje neplatné hodnoty.'};a.symp[j]=s;a.vliv[j]=v}
  }
  const lst=s=>[...new Set(s.split('').map(ch=>parseInt(ch,36)))].filter(j=>j>=0&&j<n&&j!==idx);
  a.coop=lst(p[7]).slice(0,3);a.free=lst(p[8]).slice(0,3);a.neg=lst(p[9]).slice(0,2);
  a.klima=p[10].slice(0,5).split('').map(Number);
  if(a.klima.length!==5||a.klima.some(v=>!(v>=1&&v<=5)))return {err:'Kód obsahuje neplatné hodnoty.'};
  a.ubl={a:'ano',n:'ne',x:'nevim'}[p[10][5]]||'nevim';
  return {idx,type,a};
}

function compute(c,r){
  const N=c.students.length,R=r.resp,neg=r.neg,rat=r.type==='f';
  const rs=[];R.forEach((x,i)=>{if(x)rs.push(i)});
  const P=R.map(o=>o?new Set([...o.coop,...o.free]):null);
  const st=c.students.map((s,j)=>{
    const sy=[],vl=[];let pos=0,ng=0;const posFrom=[],negFrom=[];
    rs.forEach(i=>{ if(i===j)return;
      if(rat&&R[i].symp[j]){sy.push(R[i].symp[j]);vl.push(R[i].vliv[j])}
      const p=(R[i].coop.includes(j)?1:0)+(R[i].free.includes(j)?1:0);
      if(p){pos+=p;posFrom.push(i)}
      if(neg&&R[i].neg.includes(j)){ng++;negFrom.push(i)}
    });
    const mut=rs.filter(i=>i!==j&&P[i].has(j)&&P[j]&&P[j].has(i));
    return {j,name:s.name,got:!!R[j],sy:rat?mean(sy):null,vl:rat?mean(vl):null,pos,neg:ng,posFrom,negFrom,mut,
      nak:(rat&&R[j]&&Object.keys(R[j].symp).length)?mean(Object.values(R[j].symp)):null,out:R[j]?[...P[j]]:[]};
  });
  ['sy','vl','pos','neg'].forEach(k=>{const a=st.map(s=>s[k]||0),m=mean(a),d=sd(a);st.forEach(s=>{(s.z=s.z||{})[k]=((s[k]||0)-m)/d})});
  st.forEach(s=>{
    const rej=neg?(s.neg>=3&&s.z.neg>=1&&(!rat||s.z.sy<=-.5)):(rat&&s.z.sy<=-1.2&&s.z.pos<=-.3);
    if(rs.length<4)s.status='mid';
    else if(rej)s.status='rej';
    else if(s.pos<=1&&s.mut.length===0)s.status='izol';
    else if(rat&&s.z.vl>=.8&&s.z.sy<=0)s.status='vliv';
    else if(s.z.pos>=1&&(!rat||s.z.sy>=0))s.status='star';
    else s.status='mid';
    s.comp=s.z.pos+(rat?s.z.sy:0)+.3*s.mut.length;
  });
  let pairs=0;st.forEach(s=>s.mut.forEach(i=>{if(i<s.j)pairs++}));
  const klima=[0,1,2,3,4].map(k=>mean(rs.map(i=>R[i].klima[k])));
  return {st,rs,pairs,N,rat,neg,dens:N>1?pairs/(N*(N-1)/2):0,sy:rat?mean(st.map(s=>s.sy)):null,klima,
    mood:mean(klima),withMut:rs.filter(i=>st[i].mut.length>0).length,izol:st.filter(s=>s.status==='izol').length,
    ubl:rs.filter(i=>R[i].ubl==='ano').length};
}

    conn.on('close',()=>{if(SESS&&conn.idx!=null&&SESS.live[conn.idx]&&SESS.live[conn.idx].st!=='done'){SESS.live[conn.idx].st='off';refreshSess()}});
  });
  p.on('disconnected',()=>{if(SESS&&SESS.peer===p){SESS.state='starting';refreshSess();setTimeout(()=>{try{p.reconnect()}catch(_){}},1500)}});
  p.on('error',e=>{if(!SESS)return;
    if(e.type==='unavailable-id'){SESS.state='err';SESS.msg='Sběr pro tuto třídu už běží v jiném okně nebo na jiném zařízení. Zavři ho tam, nebo chvíli počkej a zkus to znovu.'}
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){SESS.state='err';SESS.msg='Nepodařilo se spojit se spojovacím serverem. Zkontroluj internet. V náhledu uvnitř Claude živý sběr nefunguje, otevři aplikaci z její webové adresy.'}
    else if(e.type==='peer-unavailable')return;
    else{SESS.state='err';SESS.msg='Chyba spojení: '+e.type}
    refreshSess();
  });
  render();
}
function stopSession(){if(SESS){try{SESS.peer&&SESS.peer.destroy()}catch(e){}SESS=null}}
function onTeachData(conn,m){
  if(!SESS||!m||typeof m!=='object')return;
  const c=CL(),r=curRound();if(!r||c.id!==SESS.cid)return;
  if(m.t==='hi'){
    const s=c.students[m.idx];
    if(!s||s.code!==m.code){conn.send({t:'cfg',ok:false,msg:'Tenhle lístek nepatří do třídy, pro kterou teď běží sběr.'});return}
    conn.idx=m.idx;if(!SESS.live[m.idx]||SESS.live[m.idx].st!=='done')SESS.live[m.idx]={st:'on',p:0};
    conn.send({t:'cfg',ok:true,round:{id:r.id,type:r.type,neg:r.neg},done:!!r.resp[m.idx]});refreshSess();
  }else if(m.t==='prog'&&conn.idx!=null){if(SESS.live[conn.idx]&&SESS.live[conn.idx].st==='done')return;SESS.live[conn.idx]={st:'fill',p:+m.p||0};refreshSess()}
  else if(m.t==='resp'){
    const d=decodeResp(String(m.data||''),c);
    if(d.err){conn.send({t:'ack',ok:false,msg:d.err});pushFb(false,d.err);refreshSess();return}
    r.resp[d.idx]=d.a;save();SESS.live[d.idx]={st:'done'};conn.send({t:'ack',ok:true,rid:r.id});
    pushFb(true,'Přijato: '+c.students[d.idx].name);refreshSess();
  }
}

function ingest(text){

  text.split(/\s*\n\s*/).map(x=>x.trim()).filter(Boolean).forEach(line=>{

    const re=!!r.resp[d.idx];r.resp[d.idx]=d.a;if(SESS)SESS.live[d.idx]={st:'done'};
    pushFb(true,(re?'Přepsáno: ':'Přijato: ')+c.students[d.idx].name);
  });

}
async function startScan(){

function scanLoop(){
  if(!CAM)return;const v=$('#cam');
  if(v&&v.readyState>=2&&v.videoWidth&&window.jsQR){
    const cv=CAM.cv||(CAM.cv=document.createElement('canvas')),s=Math.min(1,640/v.videoWidth);cv.width=v.videoWidth*s;cv.height=v.videoHeight*s;
    const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,cv.width,cv.height);
    const d=x.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
    if(r&&r.data&&(r.data!==CAM.last||Date.now()-CAM.t>4000)){CAM.last=r.data;CAM.t=Date.now();ingest(r.data);refreshSess()}

function layout(C){
  const N=C.N,sorted=[...C.st].sort((a,b)=>b.comp-a.comp),n0=Math.max(2,Math.ceil(N*.2)),n1=Math.ceil(N*.4);
  const rings=[sorted.slice(0,n0),sorted.slice(n0,n0+n1),sorted.slice(n0+n1)];
  const par=[...Array(N).keys()],fd=x=>par[x]===x?x:(par[x]=fd(par[x]));
  C.st.forEach(s=>s.mut.forEach(i=>{par[fd(s.j)]=fd(i)}));
  const rad=[.17,.55,.92],pos={};
  rings.forEach((rg,r)=>{rg.sort((a,b)=>fd(a.j)-fd(b.j)||a.j-b.j);rg.forEach((s,k)=>{const ang=2*Math.PI*k/rg.length-Math.PI/2+r*.5;pos[s.j]=[300+rad[r]*240*Math.cos(ang),300+rad[r]*240*Math.sin(ang)]})});
  return pos;
}

function lineChart(title,pts,o){
  const W=320,H=150,l=44,rP=18,t=22,b=26,min=o.min,max=o.max;
  const x=i=>pts.length===1?(l+W-rP)/2:l+i*(W-l-rP)/(pts.length-1),y=v=>t+(H-t-b)*(1-(v-min)/(max-min));
  const ticks=o.ticks.map(v=>`<line class="grid" x1="${l}" x2="${W-rP}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${o.fmt(v)}</text>`).join('');
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const marks=pts.map((p,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="5"><title>${esc(p.label)}: ${o.fmt(p.v)}</title></circle><text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`).join('');
  const last=pts[pts.length-1];
  return `<div class="panel stack" style="gap:6px"><h3>${title}</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${ticks}<path class="ln" d="${path}"/>${marks}<text class="val" x="${x(pts.length-1)}" y="${y(last.v)-10}" text-anchor="middle">${o.fmt(last.v)}</text></svg>${o.note?`<p class="small muted">${o.note}</p>`:''}</div>`;
}

/* ================= skupiny do dílny ================= */
function makeGroups(c,r,size,seed){
  const N=c.students.length,R=r.resp,W=[...Array(N)].map(()=>Array(N).fill(0)),ch=[...Array(N)].map(()=>new Set()),ng=[...Array(N)].map(()=>new Set());
  const s=(i,j)=>{const a=R[i];if(!a)return 0;let v=0;if(a.coop.includes(j))v+=3;if(a.free.includes(j))v+=1.5;if(r.neg&&a.neg.includes(j))v-=8;if(r.type==='f'&&a.symp[j])v+=(a.symp[j]-3)*.4;return v};
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(i!==j){W[i][j]=s(i,j);const a=R[i];if(a&&(a.coop.includes(j)||a.free.includes(j)))ch[i].add(j);if(a&&r.neg&&a.neg.includes(j))ng[i].add(j)}
  const k=Math.max(1,Math.round(N/size)),sizes=Array.from({length:k},(_,g)=>Math.floor(N/k)+(g<N%k?1:0));
  const gs=g=>{let v=0;for(const i of g){let has=false;for(const j of g){if(i===j)continue;v+=W[i][j];if(ch[i].has(j)||ch[j].has(i))has=true}v+=has?6:-6}return v};
  const rnd=rng(seed*7919+N);let best=null,bestV=-1e9;
  for(let rs=0;rs<40;rs++){
    const ord=[...Array(N).keys()];for(let q=N-1;q>0;q--){const m=Math.floor(rnd()*(q+1));[ord[q],ord[m]]=[ord[m],ord[q]]}
    let p=0;const G=sizes.map(z=>ord.slice(p,p+=z));let V=G.map(gs);
    for(let it=0;it<2500&&k>1;it++){
      const a=Math.floor(rnd()*k);let b=Math.floor(rnd()*(k-1));if(b>=a)b++;
      const x=Math.floor(rnd()*G[a].length),y=Math.floor(rnd()*G[b].length);
      const ga=G[a].slice(),gb=G[b].slice();[ga[x],gb[y]]=[gb[y],ga[x]];
      const va=gs(ga),vb=gs(gb);
      if(va+vb>=V[a]+V[b]){G[a]=ga;G[b]=gb;V[a]=va;V[b]=vb}
    }
    const tot=V.reduce((x,y)=>x+y,0);if(tot>bestV){bestV=tot;best=G.map(g=>g.slice())}
  }
  return best.map(g=>g.map(i=>({i,resp:!!R[i],own:g.some(j=>j!==i&&ch[i].has(j)),chosen:g.some(j=>j!==i&&ch[j].has(i)),negIn:g.some(j=>j!==i&&(ng[i].has(j)||ng[j].has(i)))})));
}

  const c=CL();
  const tabs=[['sber','Sběr'],['vysledky','Výsledky'],['skupiny','Skupiny'],['protridu','Pro třídu'],['trida','Třída'],['info','Info']].map(([k,t])=>`<button role="tab" data-a="tab" data-t="${k}" aria-selected="${UI.tab===k}">${t}${k==='sber'&&SESS?' ●':''}</button>`).join('');
  const sel=`<select id="clsSel" aria-label="Třída">${DB.classes.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
  const demo=c.demo?`<div class="note warn noprint"><span>Ukázková třída s vymyšlenými jmény a třemi koly. Vlastní třídu založíš v záložce Třída.</span><button class="btn sm" data-a="own">Založit vlastní třídu</button></div>`:'';
  const body=UI.tab==='sber'?renderSber():UI.tab==='vysledky'?renderVysledky():UI.tab==='skupiny'?renderSkupiny():UI.tab==='protridu'?renderProTridu():UI.tab==='trida'?renderTrida():renderInfo();
  root.innerHTML=`<header class="top noprint"><div class="brand">${sel}<h1>Sociometrie třídy</h1></div><div class="tabs" role="tablist">${tabs}</div></header>${demo}<main>${body}</main>`;
  if(CAM){const v=$('#cam');if(v){v.srcObject=CAM.stream;v.play().catch(()=>{})}}
}

/* ================= akce ================= */
const toggle=(arr,v,max)=>{const k=arr.indexOf(v);if(k>=0)arr.splice(k,1);else if(arr.length<max)arr.push(v)};
const act={
  tab(b){if(b.dataset.t!=='sber')stopScan();UI.tab=b.dataset.t;UI.confirm=null;render()},
  sub(b){UI.sub=b.dataset.t;render()},
  edge(b){UI.edge=b.dataset.t;render()},
  pick(b){UI.sel=+b.dataset.j;render()},
  own(){UI.tab='trida';render();const t=$('#newName');if(t)t.focus()},
  startnew(){const c=CL();const r={id:randStr(6).toLowerCase(),date:new Date().toISOString(),type:UI.newType,neg:UI.newNeg,resp:Array(c.students.length).fill(null)};c.rounds.push(r);save();UI.fb=[];startSession(r.id)},
  continue(){const c=CL();UI.fb=[];startSession(c.rounds[c.rounds.length-1].id)},
  stop(){stopSession();stopScan();render()},
  scan(){if(CAM){stopScan();render()}else startScan()},
  paste(){const t=$('#paste').value;if(!t.trim())return;ingest(t);$('#paste').value='';refreshSess()},
  create(){
    const lines=(UI.names||'').split('\n').map(s=>s.trim()).filter(Boolean);UI.err='';
    if(lines.length<4)UI.err='Zadej alespoň 4 žáky.';else if(lines.length>MAXN)UI.err='Nejvýše '+MAXN+' žáků.';
    if(UI.err){render();return}
    let names=lines.map(l=>shortName(l,UI.shorten));const seen={};names=names.map(n=>{seen[n]=(seen[n]||0)+1;return seen[n]>1?n+' '+seen[n]:n});
    const nm=($('#newName')&&$('#newName').value.trim())||'Nová třída';
    const c=newClass(nm,names,(CL()&&!CL().demo&&CL().base)||baseUrl());DB.classes.push(c);DB.cur=c.id;UI.names=null;UI.round=null;UI.sel=null;save();render();
  },
  delclass(){
    if(UI.confirm!=='del'){UI.confirm='del';render();return}
    const c=CL();if(SESS&&SESS.cid===c.id)stopSession();DB.classes=DB.classes.filter(x=>x.id!==c.id);
    if(!DB.classes.length)DB.classes.push(demoClass());DB.cur=DB.classes[0].id;UI.confirm=null;save();render();
  },
  cancel(){UI.confirm=null;render()},
  print(){try{window.print()}catch(e){}},
  regroup(){UI.gseed++;render()},
  copygroups(b){copyText(b.dataset.txt,ok=>{b.textContent=ok?'Zkopírováno':'Kopírování nešlo'})},
  fullscreen(){const s=$('#show');try{s.requestFullscreen().catch(()=>{})}catch(e){}},
  dl(b){const[d,n,m]=expData(b.dataset.w);try{const u=URL.createObjectURL(new Blob([d],{type:m})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);expMsg('Stahuji '+n+'. Pokud se nic nestalo, použij Kopírovat.')}catch(e){expMsg('Stažení nešlo, použij Kopírovat.')}},
  cp(b){const[d]=expData(b.dataset.w);copyText(d,ok=>expMsg(ok?'Zkopírováno do schránky.':'Kopírování nešlo.'))},
  restore(){try{const d=JSON.parse($('#restore').value);if(!d||!Array.isArray(d.classes)||!d.classes.length)throw 0;stopSession();DB=d;if(!CL())DB.cur=DB.classes[0].id;save();UI.sel=null;UI.round=null;render()}catch(e){expMsg('Záloha nejde načíst. Vlož celý obsah souboru JSON.')}},
  preview(){const c=CL(),i=+$('#prevSel').value,t=(document.querySelector('input[name=pvt]:checked')||{}).value||'c';
    startStudent({cid:c.id,idx:i,code:c.students[i].code,names:c.students.map(s=>s.name)},true);ST.cfg={id:null,type:t,neg:t==='f'};render();const d=document.querySelector('details.panel');if(d)d.open=true},
  closeprev(){ST=null;render();const d=document.querySelector('details.panel');if(d)d.open=true},
  copylink(b){copyText(studentLink(CL(),ST.idx),ok=>{b.textContent=ok?'Zkopírováno':'Kopírování nešlo'})},
  start(){beginSurvey();refreshPhone();window.scrollTo(0,0)},
  rate(b){
    const j=ST.order[ST.i],had=!!(ST.a.symp[j]&&ST.a.vliv[j]),i0=ST.i;
    ST.a[b.dataset.k][j]=+b.dataset.v;refreshPhone();
    if(!had&&ST.a.symp[j]&&ST.a.vliv[j])setTimeout(()=>{if(ST&&ST.i===i0&&ST.plan[ST.step]==='rate')act.next()},260);
  },
  nom(b){toggle(ST.a[b.dataset.k],+b.dataset.j,b.dataset.k==='neg'?2:3);refreshPhone()},
  kl(b){ST.a.klima[+b.dataset.k]=+b.dataset.v;refreshPhone()},
  ubl(b){ST.a.ubl=b.dataset.v;refreshPhone()},
  next(){if(ST.plan[ST.step]==='rate'&&ST.i<ST.order.length-1)ST.i++;else ST.step++;refreshPhone();if(!ST.embedded)window.scrollTo(0,0)},
  back(){const cur=ST.plan[ST.step];if(cur==='rate'&&ST.i>0)ST.i--;else if(ST.step>0){ST.step--;if(ST.plan[ST.step]==='rate')ST.i=ST.order.length-1}refreshPhone()},
  send(){
    ST.out=encodeResp(ST.cid,ST.idx,ST.code,ST.names.length,ST.cfg.type,ST.a);ST.step=ST.plan.length-1;
    if(!ST.embedded){stuStore({out:ST.out,rid:ST.cfg.id,acked:false});trySend()}
    refreshPhone();if(!ST.embedded)window.scrollTo(0,0);
  },
  copyout(b){copyText(ST.out,ok=>{b.textContent=ok?'Zkopírováno':'Označ kód a zkopíruj ručně'})},
  ingestout(b){const c=CL();if(!c.rounds.length){b.textContent='Nejdřív spusť aspoň jedno kolo';return}ingest(ST.out);save();b.textContent=UI.fb[0]?UI.fb[0].t:'Hotovo';b.disabled=true},
  restart(){const t=ST.cfg;startStudent({cid:ST.cid,idx:ST.idx,code:ST.code,names:ST.names},true);ST.cfg=t;refreshPhone()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a]&&!b.disabled)act[b.dataset.a](b)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-a]')){e.preventDefault();act[e.target.dataset.a](e.target)}});
document.addEventListener('input',e=>{
  const id=e.target.id;if(MODE!=='teacher')return;const c=CL();
  if(id==='clsName'){c.name=e.target.value;save();const o=$('#clsSel option:checked');if(o)o.textContent=c.name}
  else if(id==='clsNames')UI.names=e.target.value;
  else if(id==='clsBase'){c.base=e.target.value.trim();save();clearTimeout(act._t);act._t=setTimeout(()=>{const sl=$('.slips');if(sl)sl.innerHTML=c.students.map((_,i)=>slipHTML(c,i)).join('')},400)}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;if(MODE!=='teacher')return;
  if(id==='clsSel'){if(SESS)stopSession();stopScan();DB.cur=t.value;UI.round=null;UI.sel=null;UI.fb=[];save();render()}
  else if(id==='roundSel'){UI.round=t.value;UI.sel=null;render()}
  else if(id==='gsize'){UI.gsize=+t.value;render()}
  else if(id==='shorten')UI.shorten=t.checked;
  else if(id==='newNeg')UI.newNeg=t.checked;
  else if(t.name==='rt')UI.newType=t.value;
});

/* ================= start ================= */
(function boot(){
  const info=location.hash.startsWith('#v2~')?parseStudentHash(location.hash):null;
  if(info){MODE='student';startStudent(info,false);render();netInit();return}
  if(location.hash.startsWith('#v')){document.getElementById('root').innerHTML='<div class="panel stack"><h2>Tenhle odkaz nejde přečíst</h2><p class="muted">Lístek je možná ze starší verze aplikace. Požádej učitele o nový.</p></div>';return}
  DB=load()||{v:2,classes:[demoClass()],cur:null};if(!CL())DB.cur=DB.classes[0].id;else DB.cur=CL().id;
  DB.classes.forEach(c=>{if(!c.base)c.base=baseUrl()});save();
  if(!CL().rounds.length)UI.tab='trida';
  render();
})();
</script>
</body>
</html>
